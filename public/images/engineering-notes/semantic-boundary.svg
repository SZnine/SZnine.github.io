<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="490"
  viewBox="0 0 640 490"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">用边界样本验证语义差异</title>
  <desc id="desc">
    同一部片长 120 分钟、评分 8.5 的电影，按严格大于 120
    分钟的要求应被排除，候选条件却用大于等于将它错误收录。
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="4"
      orient="auto"
    >
      <path
        d="M0 0 L8 4 L0 8"
        fill="none"
        stroke="#6b7280"
        stroke-width="1.4"
      />
    </marker>
  </defs>
  <rect width="640" height="490" fill="#fdfdfd" />
  <g
    font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"
    fill="#282728"
  >
    <text x="24" y="43" font-size="26" font-weight="700">
      用边界样本验证差异
    </text>
    <text x="24" y="73" font-size="20" fill="#59636d">
      同一输入，两个条件，结果不同
    </text>
    <rect x="24" y="96" width="592" height="60" rx="4" fill="#eef5f9" />
    <text x="320" y="134" text-anchor="middle" font-size="25">
      片长 120 min · 评分 8.5
    </text>
    <path
      d="M320 156 V174 H164 V199 M320 174 H476 V199"
      fill="none"
      stroke="#6b7280"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <path
      d="M164 174 V199"
      fill="none"
      stroke="#6b7280"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <rect
      x="24"
      y="206"
      width="280"
      height="196"
      rx="4"
      fill="#fdfdfd"
      stroke="#9aa4ae"
      stroke-width="1.5"
    />
    <rect
      x="336"
      y="206"
      width="280"
      height="196"
      rx="4"
      fill="#fdfdfd"
      stroke="#006cac"
      stroke-width="2"
    />
    <text x="164" y="243" text-anchor="middle" font-size="23" font-weight="700">
      原句要求
    </text>
    <text x="476" y="243" text-anchor="middle" font-size="23" font-weight="700">
      候选转换
    </text>
    <path d="M48 259 H280 M360 259 H592" fill="none" stroke="#ece9e9" />
    <text x="164" y="301" text-anchor="middle" font-size="31">
      120 &gt; 120
    </text>
    <text x="476" y="301" text-anchor="middle" font-size="31">120 ≥ 120</text>
    <path d="M465 309 H490" stroke="#006cac" stroke-width="3" />
    <text x="164" y="333" text-anchor="middle" font-size="19" fill="#59636d">
      评分 8.5 ≥ 8，满足
    </text>
    <text x="476" y="333" text-anchor="middle" font-size="19" fill="#59636d">
      评分 8.5 ≥ 8，满足
    </text>
    <text x="164" y="378" text-anchor="middle" font-size="27" font-weight="700">
      排除
    </text>
    <text
      x="476"
      y="378"
      text-anchor="middle"
      font-size="27"
      font-weight="700"
      fill="#006cac"
    >
      错误收录
    </text>
    <text x="24" y="442" font-size="22">
      唯一变化：严格大于，变成大于等于。
    </text>
    <text x="24" y="472" font-size="20" fill="#59636d">
      边界样本把一个符号的偏差变成可检查的后果。
    </text>
  </g>
</svg>
