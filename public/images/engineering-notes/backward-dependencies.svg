<svg
  xmlns="http://www.w3.org/2000/svg"
  width="640"
  height="634"
  viewBox="0 0 640 634"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">任务依赖与关键路径</title>
  <desc id="desc">
    验收与边界确认一天，样本准备两天与转换链实现三天并行，然后联调复测三天、试用交接一天。关键路径八个工作日，另预留两天，需提前十个工作日启动。
  </desc>
  <defs>
    <marker
      id="blue-arrow"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="4"
      orient="auto"
    >
      <path
        d="M0 0 L8 4 L0 8"
        fill="none"
        stroke="#006cac"
        stroke-width="1.4"
      />
    </marker>
    <marker
      id="gray-arrow"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="4"
      orient="auto"
    >
      <path
        d="M0 0 L8 4 L0 8"
        fill="none"
        stroke="#7c8790"
        stroke-width="1.4"
      />
    </marker>
  </defs>
  <rect width="640" height="634" fill="#fdfdfd" />
  <g
    font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"
    fill="#282728"
  >
    <text x="24" y="43" font-size="26" font-weight="700">
      从依赖关系找到最早完成日
    </text>
    <text x="24" y="75" font-size="20" fill="#59636d">
      蓝色实线：关键路径 · 灰色虚线：并行分支
    </text>
    <g fill="none" stroke-width="2.5">
      <path
        d="M320 172 V198 H164 V222"
        stroke="#7c8790"
        stroke-dasharray="6 5"
        marker-end="url(#gray-arrow)"
      />
      <path
        d="M320 172 V198 H476 V222"
        stroke="#006cac"
        marker-end="url(#blue-arrow)"
      />
      <path d="M164 310 V344 H320" stroke="#7c8790" stroke-dasharray="6 5" />
      <path
        d="M476 310 V344 H320 V372"
        stroke="#006cac"
        marker-end="url(#blue-arrow)"
      />
      <path d="M320 444 V476" stroke="#006cac" marker-end="url(#blue-arrow)" />
    </g>
    <g fill="#fdfdfd" stroke="#006cac" stroke-width="2">
      <rect x="150" y="108" width="340" height="64" rx="4" />
      <rect x="336" y="230" width="280" height="80" rx="4" />
      <rect x="150" y="380" width="340" height="64" rx="4" />
      <rect x="150" y="484" width="340" height="64" rx="4" />
    </g>
    <rect
      x="24"
      y="230"
      width="280"
      height="80"
      rx="4"
      fill="#fdfdfd"
      stroke="#7c8790"
      stroke-width="1.5"
      stroke-dasharray="6 5"
    />
    <text x="170" y="148" font-size="23">验收与边界确认</text>
    <text x="468" y="148" text-anchor="end" font-size="23" fill="#006cac">
      1 天
    </text>
    <text x="164" y="264" text-anchor="middle" font-size="24">样本与判分</text>
    <text x="164" y="294" text-anchor="middle" font-size="22" fill="#59636d">
      2 天
    </text>
    <text x="476" y="264" text-anchor="middle" font-size="24">最小转换链</text>
    <text x="476" y="294" text-anchor="middle" font-size="22" fill="#006cac">
      3 天
    </text>
    <text x="338" y="370" font-size="19" fill="#59636d">两项都完成</text>
    <text x="170" y="420" font-size="23">联调与复测</text>
    <text x="468" y="420" text-anchor="end" font-size="23" fill="#006cac">
      3 天
    </text>
    <text x="170" y="524" font-size="23">试用与交接</text>
    <text x="468" y="524" text-anchor="end" font-size="23" fill="#006cac">
      1 天
    </text>
    <text x="320" y="588" text-anchor="middle" font-size="22" font-weight="700">
      关键路径 8 天 ＋ 预留 2 天 ＝ 提前 10 天
    </text>
    <text x="320" y="618" text-anchor="middle" font-size="19" fill="#59636d">
      演算示例 · 按工作日计 · 两项并行工作由不同人员承担
    </text>
