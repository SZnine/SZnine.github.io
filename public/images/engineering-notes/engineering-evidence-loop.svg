    </text>
    <text x="444" y="302" font-size="18" fill="#59636d">证据支持</text>
    <text x="430" y="362" text-anchor="middle" font-size="24">实现与集成</text>
    <text x="430" y="478" text-anchor="middle" font-size="24">评测与验收</text>
    <rect x="585" y="394" width="48" height="29" fill="#fdfdfd" />
    <text x="609" y="415" text-anchor="middle" font-size="18" fill="#59636d">
      失败
    </text>
    <text x="444" y="534" font-size="18" fill="#59636d">通过</text>
    <text x="430" y="581" text-anchor="middle" font-size="24">试点 → 运行</text>
    <text x="430" y="607" text-anchor="middle" font-size="18" fill="#59636d">
      在真实流程中验证
    </text>
    <text x="144" y="547" font-size="19" fill="#006cac">失败补入</text>
    <text x="144" y="574" font-size="19" fill="#006cac">回归集</text>
    <text x="320" y="661" text-anchor="middle" font-size="22">
      评测从需求开始，失败回到样本与实现。
    </text>
  </g>
</svg>
